<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriPylon — Your safety starts here</title>
<meta
  name="description"
  content="TriPylon is a company that produces hardware wallets for cryptocurrency, secure authorization, and key storage." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-dark': '#010409', 
                        'accent-blue': '#00BFFF', 
                        'accent-glow': 'rgba(0, 191, 255, 0.4)', 
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"Liberation Mono"', 'monospace'],
                    },
                    keyframes: {
                        'move-grid': {
                            '0%': { backgroundPosition: '0 0' },
                            '100%': { backgroundPosition: '400px 400px' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'move-grid': 'move-grid 60s linear infinite',
                        'fade-in': 'fade-in 1s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
       
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: theme('colors.primary-dark');
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: move-grid 60s linear infinite;
            opacity: 0.8;
        }


        .main-headline {
            font-size: clamp(2.5rem, 5vw, 4rem); 
            line-height: 1.1;
        }

        
        .main-grid-container {
            
            min-height: 100vh;
        }
        
    </style>
</head>
<body class="bg-primary-dark text-white">

    <div class="animated-background"></div>

    
    <header class="w-full bg-primary-dark/90 sticky top-0 z-20 border-b border-white/5 shadow-lg shadow-black/30 backdrop-blur-sm">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            
            <div class="flex items-center space-x-2">
                
                <img src="logo_better_white.svg" alt="TriPylon Logo" class="h-10 " 
                     onerror="this.onerror=null; this.style.display='none'; document.getElementById('header-logo-fallback').style.display='block';">
                
                <span id="header-logo-fallback" class="font-mono text-xl text-accent-blue hidden">TriPylon</span>
            </div>

            
            <div class="hidden lg:flex items-center space-x-6 text-sm font-medium text-gray-300">
                <a href="#" class="hover:text-accent-blue transition duration-200">Hardware</a>
                <a href="#" class="hover:text-accent-blue transition duration-200">Software</a>
                <a href="#" class="hover:text-accent-blue transition duration-200">Docs</a>
                <a href="#" class="hover:text-accent-blue transition duration-200">B2B</a>
                <a href="#" class="hover:text-accent-blue transition duration-200">Support</a>
            </div>

            
            <div class="flex items-center space-x-4">
                <button class="text-gray-300 hover:text-accent-blue transition duration-200 text-sm font-medium flex items-center">
                    EN
                    <svg class="w-4 h-4 ml-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                
                <button class="lg:hidden text-gray-300 hover:text-accent-blue">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </nav>
    </header>

    
    
    <div class="main-grid-container w-full max-w-7xl mx-auto flex items-start relative z-10 px-4 sm:px-6 lg:px-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center w-full pt-16 pb-12">
            
            
            <div class="text-left">
                
                
                <p class="font-mono text-sm tracking-[0.2em] uppercase text-accent-blue mb-4 opacity-0 animate-fade-in" style="animation-delay: 0.1s;">ENTRY-LEVEL</p>
                
                
                <h1 class="main-headline font-extrabold text-gray-100 mb-6 opacity-0 animate-fade-in" style="animation-delay: 0.3s;">
                    Protect your crypto simply.
                </h1>
                
                
                <p class="text-lg text-gray-400 mb-10 max-w-md opacity-0 animate-fade-in" style="animation-delay: 0.5s;">
                    Start protecting your crypto assets with the entry-level hardware wallet. Safe, simple, affordable.
                </p>

                
                <div class="flex flex-col sm:flex-row gap-4 items-start opacity-0 animate-fade-in" style="animation-delay: 0.7s;">
                    <button onclick="window.location.href='#'"
                        class="px-8 py-3 font-bold text-lg rounded-full transition duration-300 ease-in-out
                               bg-accent-blue hover:bg-sky-500 text-primary-dark shadow-xl shadow-accent-blue/50
                               transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-accent-blue/50">
                        Join waitlist
                    </button>
                    
                    <p class="text-sm md:text-base text-gray-400 font-medium self-center mt-2 sm:mt-0">
                        Your safety starts here.
                    </p>
                </div>

                
                <div class="mt-16 flex flex-col sm:flex-row gap-8 opacity-0 animate-fade-in" style="animation-delay: 0.9s;">
                    
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-accent-blue"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span class="text-md text-gray-300">Industry-leading security</span>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-accent-blue"><circle cx="12" cy="12" r="10"/><path d="M9.09 9C9.35 8.76 9.68 8.6 10.07 8.56C11.1 8.44 12 9.25 12 10.5C12 11.75 11.1 12.56 10.07 12.44C9.68 12.4 9.35 12.24 9.09 12"/></svg>
                        <span class="text-md text-gray-300">Absolute ease of use</span>
                    </div>
                </div>
            </div>

            
            <div class="relative flex justify-center items-center py-12 lg:py-0 opacity-0 animate-fade-in" style="animation-delay: 1.1s;">
                
                                <img 
                    src="device.png" 
                    alt="TriPylon Hardware Wallet Mockup" 
                    class="w-full max-w-md h-auto object-cover rounded-xl transform hover:scale-[1.01] transition-transform duration-500"
                
                />
            </div>
        </div>

    </div>
    
    
    <!--<footer class="absolute bottom-4 w-full text-center text-xs text-slate-500 z-10 opacity-0 animate-fade-in" style="animation-delay: 1.3s;">
        TriPylon &copy; 2024. All rights reserved.
    </footer> -->

    
    <h1 id="project-name-fallback" class="hidden">TriPylon</h1>
</body>
</html>
